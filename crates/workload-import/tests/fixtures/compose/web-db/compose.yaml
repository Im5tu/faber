services:
  web:
    image: ghcr.io/acme/shop-web:1.4.2
    restart: unless-stopped
    command: ["serve", "--listen", "0.0.0.0:8080"]
    environment:
      DATABASE_URL: postgres://shop:shop@db:5432/shop
      LOG_LEVEL: info
      WORKERS: 4
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    x-faber:
      expose: cluster

  db:
    image: postgres:16
    restart: always
    environment:
      - POSTGRES_USER=shop
      - POSTGRES_PASSWORD=shop
      - POSTGRES_DB=shop
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 1m
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]

volumes:
  pgdata:
