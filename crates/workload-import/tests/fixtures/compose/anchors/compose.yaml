x-common: &common
  image: ghcr.io/acme/worker:2.0
  restart: on-failure
  environment: &env
    QUEUE_URL: redis://queue:6379
    LOG_LEVEL: info
  deploy:
    resources:
      limits:
        memory: 128M

x-probe: &probe
  interval: 15s
  timeout: 3s

services:
  queue:
    image: redis:7
    healthcheck:
      <<: *probe
      test: [CMD, redis-cli, ping]

  mailer:
    <<: *common
    command: worker --queue mail

  reports:
    <<: *common
    command: worker --queue reports
    environment:
      <<: *env
      LOG_LEVEL: debug
    restart: "no"
