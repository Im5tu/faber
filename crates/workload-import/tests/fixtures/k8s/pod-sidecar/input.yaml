# A bare Pod: the builder writes into a shared emptyDir and the sidecar
# serves what it finds there.
apiVersion: v1
kind: Pod
metadata:
  name: report
spec:
  restartPolicy: OnFailure
  nodeSelector:
    kubernetes.io/hostname: node-2
  containers:
    - name: builder
      image: example.com/report-builder:2
      command: ["/bin/sh", "-c"]
      args: ["build --out $(OUT_DIR)"]
      env:
        - name: OUT_DIR
          value: /out
      workingDir: /work
      volumeMounts:
        - name: shared
          mountPath: /out
    - name: server
      image: nginx:1.27
      ports:
        - containerPort: 80
      volumeMounts:
        - name: shared
          mountPath: /usr/share/nginx/html/
          readOnly: true
          subPath: public
      securityContext:
        capabilities:
          add: ["CAP_NET_BIND_SERVICE", "chown"]
  volumes:
    - name: shared
      emptyDir: {}
