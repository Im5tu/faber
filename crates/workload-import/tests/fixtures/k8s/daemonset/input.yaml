apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: log-agent
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app: log-agent
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: log-agent
    spec:
      tolerations:
        - operator: Exists
      priorityClassName: system-node-critical
      containers:
        - name: agent
          image: fluent/fluent-bit:3.1
          args: ["--config=/etc/agent/agent.conf"]
          resources:
            limits:
              cpu: 0.2
              memory: 100M
              ephemeral-storage: 1Gi
          volumeMounts:
            - name: logs
              mountPath: /var/log
              readOnly: true
            - name: state
              mountPath: /var/lib/agent
      volumes:
        - name: logs
          hostPath:
            path: /var/log
        - name: state
          hostPath:
            path: /var/lib/log-agent
            type: DirectoryOrCreate
        - name: token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
