# A web application as `kubectl apply -f` takes it: settings, the
# Deployment that reads them, and the Service in front of it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-settings
  namespace: shop
data:
  LOG_LEVEL: info
  DB_HOST: db.shop.svc
  DB_PORT: "5432"
  feature.flags: "search,checkout"
  not a variable: skipped
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: shop
  labels:
    app: web
  annotations:
    faber.internal/expose: cluster
    deployment.kubernetes.io/revision: "4"
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
  template:
    metadata:
      labels:
        app: web
    spec:
      terminationGracePeriodSeconds: 45
      serviceAccountName: web
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: registry.example.com/shop/web:1.4.2
          imagePullPolicy: IfNotPresent
          args:
            - --listen=:$(PORT)
            - --db=$(DATABASE_URL)
            - --literal=$$(PORT)
          envFrom:
            - prefix: APP_
              configMapRef:
                name: web-settings
          env:
            - name: PORT
              value: "8080"
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: web-settings
                  key: DB_HOST
            - name: DATABASE_URL
              value: postgres://$(DB_HOST):$(APP_DB_PORT)/shop
            - name: TRACING
              valueFrom:
                configMapKeyRef:
                  name: web-settings
                  key: TRACING_ENDPOINT
                  optional: true
            - name: APP_LOG_LEVEL
              value: debug
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9090
              protocol: TCP
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              cpu: 1
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              add: [NET_BIND_SERVICE]
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: shop
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: http
