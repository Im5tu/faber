# Every object has something wrong. All of it is reported in one run.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: Web_Frontend
spec:
  template:
    spec:
      hostNetwork: true
      initContainers:
        - name: migrate
          image: example.com/migrate:1
      containers:
        - name: web
          image: example.com/web:1
          env:
            - name: PORT
              value: 8080
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: web-secrets
                  key: api-key
          resources:
            limits:
              memory: 256m
              nvidia.com/gpu: 1
          securityContext:
            privileged: true
---
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
spec:
  template:
    spec:
      containers:
        - name: migrate
          image: example.com/migrate:1
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: db
          image: postgres:16
          lifecycle:
            preStop:
              exec:
                command: [pg_ctl, stop]
          livenessProbe:
            grpc:
              port: 9000
          volumeMounts:
            - name: config
              mountPath: /etc/postgresql
          futureField: 1
      volumes:
        - name: config
          configMap:
            name: db-config
---
apiVersion: v1
kind: Secret
metadata:
  name: web-secrets
stringData:
  api-key: hunter2
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: canary
spec: {}
