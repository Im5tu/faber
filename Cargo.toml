[workspace]
members = [
    "src/faber",
    "src/fabercp",
    "crates/api-types",
    "crates/network-management",
    "crates/container-runtime",
    "crates/crypto",
    "crates/cri",
    "crates/image",
    "crates/node-protocol",
    "src/faber-node",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
faber-api-types = { path = "crates/api-types" }
faber-network-management = { path = "crates/network-management" }
faber-container-runtime = { path = "crates/container-runtime" }
faber-crypto = { path = "crates/crypto" }
faber-cri = { path = "crates/cri" }
faber-image = { path = "crates/image" }
faber-node-protocol = { path = "crates/node-protocol" }

openraft = { version = "0.9.25", features = ["serde", "storage-v2"] }
rocksdb = { version = "0.25", default-features = false, features = ["bindgen-runtime", "lz4"] }
rmcp = { version = "3.5", features = ["server", "macros", "schemars", "transport-streamable-http-server"] }
schemars = "1"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
serde-saphyr = { version = "1.3", default-features = false, features = ["deserialize"] }
shlex = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
if-addrs = "0.15"
x25519-dalek = { version = "2", features = ["static_secrets"] }
base64 = "0.22"
ipnet = { version = "2", features = ["serde"] }
getrandom = "0.4"
tonic = "0.14"
prost = "0.14"
prost-types = "0.14"
hyper-util = { version = "0.1", features = ["tokio"] }
hickory-server = "0.26"
hickory-proto = "0.26"
hickory-resolver = "0.26"
chacha20poly1305 = "0.11"
hmac = "0.13"
sha2 = "0.11"
zeroize = "1"
socket2 = "0.6"
nix = { version = "0.31", features = ["fs", "mount", "process", "user"] }

# dev
tempfile = "3"
wiremock = "0.6"
assert_cmd = "2"
http-body-util = "0.1"
