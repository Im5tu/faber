[package]
name = "fabercp"
description = "Faber control plane: Raft consensus, REST API and MCP endpoint"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
faber-api-types = { workspace = true }
faber-crypto = { workspace = true }
faber-network-management = { workspace = true }
faber-container-runtime = { workspace = true }
faber-node-protocol = { workspace = true }
openraft = { workspace = true }
rocksdb = { workspace = true }
rmcp = { workspace = true }
schemars = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
reqwest = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tower-http = { workspace = true }
if-addrs = { workspace = true }
x25519-dalek = { workspace = true }
base64 = { workspace = true }
ipnet = { workspace = true }
getrandom = { workspace = true }
zeroize = { workspace = true }
hickory-proto = { workspace = true }
socket2 = { workspace = true, features = ["all"] }
rustls = { workspace = true }
tokio-rustls = { workspace = true }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { workspace = true }

[dev-dependencies]
tower = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
faber-api-types = { workspace = true, features = ["client"] }
tempfile = { workspace = true }
http-body-util = { workspace = true }
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-reqwest"] }
reqwest = { workspace = true }
