# Release on a v* tag.
#
# The tag must equal v + workspace.package.version. The workflow builds both
# Linux targets, scans the SBOMs, attests the assets, then drafts the release,
# uploads the assets and publishes it. Immutable releases lock the assets at
# publish, so nothing is edited afterwards.
name: release

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      epoch: ${{ steps.meta.outputs.epoch }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check the tag is on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tagged commit ${GITHUB_SHA} is not reachable from origin/main" >&2
            exit 1
          fi

      - name: Check the tag against the version
        id: meta
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          rustup toolchain install
          version="$(cargo metadata --no-deps --locked --format-version 1 \
            | jq -r '.packages[] | select(.name == "fabercp") | .version')"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Unexpected workspace version: ${version}" >&2
            exit 1
          fi
          if [ "$TAG" != "v${version}" ]; then
            echo "Tag ${TAG} does not match workspace version v${version}" >&2
            exit 1
          fi
          epoch="$(git log -1 --format=%ct)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "epoch=${epoch}" >> "$GITHUB_OUTPUT"

  build:
    name: build
    needs: verify
    uses: ./.github/workflows/_build.yml
    permissions:
      contents: read
      id-token: write # lets the attest job in _build.yml sign
      attestations: write # lets the attest job in _build.yml store attestations
    with:
      version: ${{ needs.verify.outputs.version }}
      epoch: ${{ needs.verify.outputs.epoch }}

  publish:
    name: publish
    needs: [verify, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # create, upload to and publish the release
      attestations: read # verify attestations before publishing
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      SIGNER: ${{ github.repository }}/.github/workflows/_build.yml
    steps:
      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: assets

      - name: Check the assets
        run: |
          set -euo pipefail
          ls -l assets
          test "$(find assets -maxdepth 1 -type f | wc -l)" -eq 5

      - name: Draft the release
        run: |
          set -euo pipefail
          args=(--draft --verify-tag --generate-notes --title "$TAG")
          if [[ "$TAG" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG" "${args[@]}"

      - name: Upload the assets
        run: |
          set -euo pipefail
          gh release upload "$TAG" assets/*

      - name: Verify the assets before publishing
        run: |
          set -euo pipefail
          for f in assets/*; do
            gh attestation verify "$f" --repo "$GH_REPO" --signer-workflow "$SIGNER" \
              --source-ref "refs/tags/${TAG}"
          done

      - name: Publish the release
        run: gh release edit "$TAG" --draft=false

      # Only a draft can be deleted: a published release is locked.
      - name: Delete the draft on failure
        if: failure()
        run: |
          set -euo pipefail
          is_draft="$(gh release view "$TAG" --json isDraft --jq .isDraft || echo false)"
          if [ "$is_draft" = "true" ]; then
            gh release delete "$TAG" --yes
          fi

  smoke:
    name: smoke
    needs: [verify, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # download the release assets
      attestations: read # verify attestations
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      SIGNER: ${{ github.repository }}/.github/workflows/_build.yml
    steps:
      - name: Download the published assets
        run: |
          set -euo pipefail
          mkdir smoke
          gh release download "$TAG" --dir smoke
          test "$(find smoke -maxdepth 1 -type f | wc -l)" -eq 5

      - name: Verify the release
        run: |
          set -euo pipefail
          # The release attestation can lag the publish, so retry briefly.
          retry() {
            local i
            for i in 1 2 3 4 5; do
              if "$@"; then
                return 0
              fi
              echo "Attempt ${i} failed; retrying in 10s" >&2
              sleep 10
            done
            return 1
          }
          retry gh release verify "$TAG"
          for f in smoke/*; do
            retry gh release verify-asset "$TAG" "$f"
          done

      - name: Verify provenance
        run: |
          set -euo pipefail
          for f in smoke/*.tar.gz smoke/*.cdx.json smoke/SHA256SUMS; do
            gh attestation verify "$f" --repo "$GH_REPO" --signer-workflow "$SIGNER" \
              --source-ref "refs/tags/${TAG}"
          done

      - name: Verify SBOM attestations
        run: |
          set -euo pipefail
          for f in smoke/*.tar.gz; do
            gh attestation verify "$f" --repo "$GH_REPO" --signer-workflow "$SIGNER" \
              --source-ref "refs/tags/${TAG}" \
              --predicate-type https://cyclonedx.org/bom
          done

      - name: Check checksums
        run: |
          set -euo pipefail
          cd smoke
          sha256sum -c SHA256SUMS
